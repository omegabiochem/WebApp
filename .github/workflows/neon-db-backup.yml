name: Neon Production DB Backup to S3

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

jobs:
  backup-neon-db:
    name: Backup Neon Production Database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DB_BACKUP_BUCKET: ${{ secrets.DB_BACKUP_BUCKET }}
      AWS_KMS_KEY_ID: ${{ secrets.AWS_KMS_KEY_ID }}
      NEON_PRODUCTION_DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DATABASE_URL }}
      PGSSLMODE: require

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create database backup
        run: |
          set -euo pipefail

          TIMESTAMP="$(date -u +'%Y%m%d-%H%M%SZ')"
          BACKUP_DIR="backup-output"
          BACKUP_FILE="$BACKUP_DIR/omega-lims-production-$TIMESTAMP.dump"
          CHECKSUM_FILE="$BACKUP_FILE.sha256"

          mkdir -p "$BACKUP_DIR"

          /usr/lib/postgresql/17/bin/pg_dump "$NEON_PRODUCTION_DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --verbose \
            --file="$BACKUP_FILE"

          sha256sum "$BACKUP_FILE" > "$CHECKSUM_FILE"

          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
          echo "CHECKSUM_FILE=$CHECKSUM_FILE" >> "$GITHUB_ENV"

      - name: Upload backup to S3 with SSE-KMS
        run: |
          set -euo pipefail

          YEAR="$(date -u +'%Y')"
          MONTH="$(date -u +'%m')"
          DAY="$(date -u +'%d')"
          WEEK="$(date -u +'%V')"
          DAY_OF_WEEK="$(date -u +'%u')"
          DAY_OF_MONTH="$(date -u +'%d')"

          BACKUP_BASENAME="$(basename "$BACKUP_FILE")"
          CHECKSUM_BASENAME="$(basename "$CHECKSUM_FILE")"

          DAILY_PREFIX="daily/$YEAR/$MONTH/$DAY"
          DAILY_BACKUP_KEY="$DAILY_PREFIX/$BACKUP_BASENAME"
          DAILY_CHECKSUM_KEY="$DAILY_PREFIX/$CHECKSUM_BASENAME"

          echo "Uploading daily backup..."

          aws s3 cp "$BACKUP_FILE" "s3://$DB_BACKUP_BUCKET/$DAILY_BACKUP_KEY" \
            --sse aws:kms \
            --sse-kms-key-id "$AWS_KMS_KEY_ID"

          aws s3 cp "$CHECKSUM_FILE" "s3://$DB_BACKUP_BUCKET/$DAILY_CHECKSUM_KEY" \
            --sse aws:kms \
            --sse-kms-key-id "$AWS_KMS_KEY_ID"

          if [ "$DAY_OF_WEEK" = "7" ]; then
            WEEKLY_PREFIX="weekly/$YEAR/week-$WEEK"
            WEEKLY_BACKUP_KEY="$WEEKLY_PREFIX/$BACKUP_BASENAME"
            WEEKLY_CHECKSUM_KEY="$WEEKLY_PREFIX/$CHECKSUM_BASENAME"

            echo "Uploading weekly backup..."

            aws s3 cp "$BACKUP_FILE" "s3://$DB_BACKUP_BUCKET/$WEEKLY_BACKUP_KEY" \
              --sse aws:kms \
              --sse-kms-key-id "$AWS_KMS_KEY_ID"

            aws s3 cp "$CHECKSUM_FILE" "s3://$DB_BACKUP_BUCKET/$WEEKLY_CHECKSUM_KEY" \
              --sse aws:kms \
              --sse-kms-key-id "$AWS_KMS_KEY_ID"
          fi

          if [ "$DAY_OF_MONTH" = "01" ]; then
            MONTHLY_PREFIX="monthly/$YEAR/$MONTH"
            MONTHLY_BACKUP_KEY="$MONTHLY_PREFIX/$BACKUP_BASENAME"
            MONTHLY_CHECKSUM_KEY="$MONTHLY_PREFIX/$CHECKSUM_BASENAME"

            echo "Uploading monthly backup..."

            aws s3 cp "$BACKUP_FILE" "s3://$DB_BACKUP_BUCKET/$MONTHLY_BACKUP_KEY" \
              --sse aws:kms \
              --sse-kms-key-id "$AWS_KMS_KEY_ID"

            aws s3 cp "$CHECKSUM_FILE" "s3://$DB_BACKUP_BUCKET/$MONTHLY_CHECKSUM_KEY" \
              --sse aws:kms \
              --sse-kms-key-id "$AWS_KMS_KEY_ID"
          fi

      - name: Verify uploaded backup exists
        run: |
          set -euo pipefail

          YEAR="$(date -u +'%Y')"
          MONTH="$(date -u +'%m')"
          DAY="$(date -u +'%d')"

          DAILY_PREFIX="daily/$YEAR/$MONTH/$DAY"

          echo "Verifying daily backup..."
          aws s3 ls "s3://$DB_BACKUP_BUCKET/$DAILY_PREFIX/"