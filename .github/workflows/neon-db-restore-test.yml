name: Neon DB Restore Test from S3

on:
  workflow_dispatch:
    inputs:
      backup_s3_key:
        description: "Optional: S3 key for .dump file"
        required: false
        type: string
      checksum_s3_key:
        description: "Optional: S3 key for .sha256 file"
        required: false
        type: string

  push:
    branches:
      - master
    paths:
      - ".github/workflows/neon-db-restore-test.yml"

jobs:
  restore-test:
    name: Restore Backup Into Neon Test Branch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DB_BACKUP_BUCKET: ${{ secrets.DB_BACKUP_BUCKET }}
      NEON_RESTORE_TEST_DATABASE_URL: ${{ secrets.NEON_RESTORE_TEST_DATABASE_URL }}
      PGSSLMODE: require

    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_restore --version
          /usr/lib/postgresql/17/bin/psql --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve backup keys
        run: |
          set -euo pipefail

          INPUT_BACKUP_KEY="${{ inputs.backup_s3_key }}"
          INPUT_CHECKSUM_KEY="${{ inputs.checksum_s3_key }}"

          if [ -n "$INPUT_BACKUP_KEY" ] && [ -n "$INPUT_CHECKSUM_KEY" ]; then
            echo "Using manually provided backup keys..."
            BACKUP_S3_KEY="$INPUT_BACKUP_KEY"
            CHECKSUM_S3_KEY="$INPUT_CHECKSUM_KEY"
          else
            echo "No manual keys provided. Finding latest daily backup from S3..."

            BACKUP_S3_KEY="$(aws s3api list-objects-v2 \
              --bucket "$DB_BACKUP_BUCKET" \
              --prefix "daily/" \
              --query "sort_by(Contents[?ends_with(Key, '.dump')], &LastModified)[-1].Key" \
              --output text)"

            if [ "$BACKUP_S3_KEY" = "None" ] || [ -z "$BACKUP_S3_KEY" ]; then
              echo "No .dump backup file found under daily/"
              exit 1
            fi

            CHECKSUM_S3_KEY="$BACKUP_S3_KEY.sha256"
          fi

          echo "Backup key: $BACKUP_S3_KEY"
          echo "Checksum key: $CHECKSUM_S3_KEY"

          echo "BACKUP_S3_KEY=$BACKUP_S3_KEY" >> "$GITHUB_ENV"
          echo "CHECKSUM_S3_KEY=$CHECKSUM_S3_KEY" >> "$GITHUB_ENV"

      - name: Download backup from S3
        run: |
          set -euo pipefail

          mkdir -p restore-input

          BACKUP_FILE="restore-input/backup.dump"
          CHECKSUM_FILE="restore-input/backup.dump.sha256"

          aws s3 cp "s3://$DB_BACKUP_BUCKET/$BACKUP_S3_KEY" "$BACKUP_FILE"
          aws s3 cp "s3://$DB_BACKUP_BUCKET/$CHECKSUM_S3_KEY" "$CHECKSUM_FILE"

          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
          echo "CHECKSUM_FILE=$CHECKSUM_FILE" >> "$GITHUB_ENV"

      - name: Verify checksum
        run: |
          set -euo pipefail

          EXPECTED_HASH="$(awk '{print $1}' "$CHECKSUM_FILE")"
          ACTUAL_HASH="$(sha256sum "$BACKUP_FILE" | awk '{print $1}')"

          echo "Expected: $EXPECTED_HASH"
          echo "Actual:   $ACTUAL_HASH"

          if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
            echo "Checksum verification failed"
            exit 1
          fi

          echo "Checksum verification passed"


      - name: Clean restore-test database before restore
        run: |
          set -euo pipefail

          echo "Cleaning restore-test database public schema..."

          /usr/lib/postgresql/17/bin/psql "$NEON_RESTORE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            DROP SCHEMA IF EXISTS public CASCADE;
            CREATE SCHEMA public;
          "

          echo "Restore-test database cleaned."

      - name: Restore backup into Neon restore-test database
        run: |
          set -euo pipefail

          /usr/lib/postgresql/17/bin/pg_restore \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges \
            --verbose \
            --dbname="$NEON_RESTORE_TEST_DATABASE_URL" \
            "$BACKUP_FILE"

      - name: Verify restored database
        run: |
          set -euo pipefail

          /usr/lib/postgresql/17/bin/psql "$NEON_RESTORE_TEST_DATABASE_URL" -c "
            SELECT current_database() AS database_name, now() AS verified_at;
          "

          /usr/lib/postgresql/17/bin/psql "$NEON_RESTORE_TEST_DATABASE_URL" -c "
            SELECT COUNT(*) AS table_count
            FROM information_schema.tables
            WHERE table_schema = 'public';
          "